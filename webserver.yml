---
- name: Configure Nginx Web Server
  hosts: webservers
  become: yes

  tasks:
    - name: Install Nginx
      dnf:
        name: nginx
        state: present

    - name: Start and enable Nginx service
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy custom index.html
      copy:
        dest: /usr/share/nginx/html/index.html
        content: |
          <h1>Project 15: Automated with Ansible - Rahul Senapati</h1>
